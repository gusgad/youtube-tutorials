apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 60

      containers:
      - name: api
        image: registry.example.com/api:1.42.0
        ports:
        - name: http
          containerPort: 3000
        - name: probes 
          containerPort: 3001
        startupProbe:
          httpGet:
            path: /startupz
            port: probes
          periodSeconds: 5
          failureThreshold: 60
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /livez
            port: probes
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          periodSeconds: 2
          timeoutSeconds: 1
          failureThreshold: 2
          successThreshold: 1
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi   

        env:
        - name: PORT
          value: "3000"
        - name: PROBE_PORT
          value: "3001"

---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: http 