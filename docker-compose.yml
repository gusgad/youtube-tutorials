version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: chatterbox
      POSTGRES_PASSWORD: chatterbox_dev_pw
      POSTGRES_DB: chatterbox
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_ERLANG_COOKIE: chatterbox_dev_cookie_value
    ports:
      - '5672:5672'
      - '15672:15672'

  backend:
    build: ./backend
    env_file: .env
    environment:
      PGHOST: postgres
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    ports:
      - '4000:4000'
    depends_on:
      - postgres
      - redis
      - rabbitmq
    volumes:
      - ./backend:/app
      - /app/node_modules

  worker:
    build: ./backend
    command: node worker/notificationWorker.js
    env_file: .env
    environment:
      PGHOST: postgres
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
