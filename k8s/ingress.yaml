apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatterbox-ingress
  namespace: chatterbox
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: chatterbox.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 5173
