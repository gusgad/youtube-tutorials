apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatterbox
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: chatterbox/backend:latest
          envFrom:
            - configMapRef:
                name: chatterbox-config
          ports:
            - containerPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatterbox
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
