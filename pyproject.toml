[project]
name = "log-triage-app"
version = "0.1.0"
description = "Log triage AI agent built with Google ADK, deployed to Agent Engine with Agent Identity, Memory Bank, and Agent Gateway"
requires-python = ">=3.10,<3.13"
dependencies = [
    "google-adk>=1.19.0,<2.0.0",
    "cloudpickle>=3.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.128.0,<2.0.0",
    "google-genai>=1.52.0,<2.0.0",
    "pydantic>=2.10.6,<3.0.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
